<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="本地保存的抖音视频、图集与实况解析任务台">
  <meta name="theme-color" content="#080a0f">
  <title>拾光 · 媒体解析台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23100b10'/%3E%3Cpath d='M18 20h28v7H18zm7 17h21v7H25z' fill='%23ffd39a'/%3E%3Ccircle cx='18' cy='40.5' r='4' fill='%23e8a7c5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="解析台首页">
        <span class="brand-mark"><i></i><i></i></span>
        <span class="brand-copy"><strong>拾光</strong><small>LOCAL MEDIA ENGINE</small></span>
      </a>
      <div class="system-status" id="systemStatus"><span class="pulse"></span><span>正在连接</span></div>
    </header>

    <main>
      <section class="command-deck" aria-labelledby="pageTitle">
        <div class="command-intro">
          <div class="section-index"><span>01</span><i></i><span>CAPTURE</span></div>
          <p class="eyebrow">本地媒体收件箱</p>
          <h1 id="pageTitle"><span>捕捉链接，</span><em>保存此刻。</em></h1>
          <p class="intro-note">视频、图集、实况会在后台并行解析并保存。你只需要继续粘贴，不必等待上一条完成。</p>
        </div>

        <div class="capture-stage">
          <form id="captureForm" class="capture-form">
            <div class="capture-label"><label for="urlInput">DROP A DOUYIN LINK</label><span>CTRL + V</span></div>
            <div class="input-wrap">
              <textarea id="urlInput" rows="4" placeholder="粘贴分享口令、短链接，或一次放入多条链接…" autocomplete="off" spellcheck="false"></textarea>
              <div class="input-actions">
                <span class="auto-note"><i></i>识别到链接后自动提交</span>
                <button type="submit"><span>送入队列</span><b>↗</b></button>
              </div>
            </div>
          </form>

          <div class="runtime-rail" aria-label="运行信息">
            <div><span class="metric-value" id="activeMetric">0</span><small>处理中</small></div>
            <div><span class="metric-value" id="queueMetric">0</span><small>等待队列</small></div>
            <div><span class="metric-value">24h</span><small>本地保留</small></div>
            <div class="rail-line"><i></i></div>
          </div>
        </div>
      </section>

      <section class="workspace" aria-labelledby="tasksTitle">
        <div class="section-head">
          <div class="title-lockup">
            <div class="section-index"><span>02</span><i></i><span>LIBRARY</span></div>
            <div><p class="eyebrow">动态任务库</p><h2 id="tasksTitle">正在发生</h2></div>
          </div>
          <div class="queue-stat" id="queueStat">0 个任务</div>
        </div>
        <div id="taskGrid" class="task-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state">
          <div class="empty-signal"><i></i><i></i><span>＋</span></div>
          <div><h3>这里还很安静</h3><p>粘贴第一条链接，任务的解析轨迹会出现在这里。</p></div>
        </div>
      </section>
    </main>

    <footer class="site-footer"><span>拾光 / PRIVATE WORKSPACE</span><span>媒体与任务各自保留 24 小时</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
